<!DOCTYPE html>

<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>s</title>
    <link rel="stylesheet" href="style.css">

</head>
<body> 
    <div  class="container">
        <div class="screen  active" id="start_screen"><!----c'est cette div qui contient tous les element qui vont s'afficher sur la premier interface----->
            <h1>Quiz Game</h1>
            <p>test your are know ledge with these fun questions</p>
            <button id="start_bnt">Strat Quiz</button>
        </div>
        <div class="screen " id="quiz_screen"><!----celleci contien ceux de la deuxieme interface (ou l'on choisi les reponses . voie la question et voit son evolutions------>
            <div class="quiz_header">
                <h1 id="question_test">Question goes here</h1>
                <div class="quiz_info">
                    <p>
                        question <span id="current_question">1</span> of <span id="total_question">5</span>
                    </p>
                    <p> score : <span id="score">0</span></p>
                </div>
            </div>
            <div id="answers_container" class="answers_container">
            <!--ici vas contenir uniquement les propositions de reponse---->
            </div>
            <div class="progress_bar">
                <div id="progress" class="progress"></div>
            </div>
        </div>

        <div id="result_screen" class="screen"> <!------ce qui va s'afficher apres avoir repondu aux questions------->
            <h1>Quiz Result</h1>
            <div class="result_info">
                <p> you score  <span id="final_score">0</span> out of <span id="max_score">5</span> </p>
                <div id="result_message"> Good job</div>
            </div>
            <button id="restart_bnt"> Restart Quiz</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
